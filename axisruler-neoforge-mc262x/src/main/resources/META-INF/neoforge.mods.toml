modLoader = "javafml"
loaderVersion = "[1,)"
license = "${modLicense}"
issueTrackerURL = "${modIssues}"

[[mods]]
modId = "${modId}"
version = "${version}"
displayName = "${modName}"
authors = "${modAuthors}"
description = '''
${modDescription}
'''
logoFile = "assets/axisruler/icon.png"
displayURL = "${modHomepage}"

# Client-only mod: NeoForge will refuse to load it on a dedicated server.
[[mods.dependencies.${modId}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforgeRange}"
ordering = "NONE"
side = "CLIENT"

[[mods.dependencies.${modId}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraftRange}"
ordering = "NONE"
side = "CLIENT"

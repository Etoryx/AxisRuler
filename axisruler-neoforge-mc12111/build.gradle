plugins {
    id "net.neoforged.moddev" version "${moddevgradle_version}"
}

base {
    archivesName = "${mod_id}-neoforge-mc12111"
}

neoForge {
    version = "${neoforge_12111}"

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
    }
}

dependencies {
    implementation project(":axisruler-core")
}

// Bundle the shared core classes/sources straight into the platform jar so the
// distributed mod is a single self-contained file (mirrors the Fabric modules).
jar {
    from(project(":axisruler-core").sourceSets.main.output)
}

sourcesJar {
    from(project(":axisruler-core").sourceSets.main.allSource)
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraftRange", minecraft_12111
    inputs.property "neoforgeRange", neoforge_range_12111

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
                version: project.version,
                modId: mod_id,
                modName: mod_name,
                modDescription: mod_description,
                modLicense: mod_license,
                modAuthors: mod_authors,
                modHomepage: mod_homepage,
                modSources: mod_sources,
                modIssues: mod_issues,
                minecraftRange: "[${minecraft_12111}]",
                neoforgeRange: neoforge_range_12111
        )
    }
}

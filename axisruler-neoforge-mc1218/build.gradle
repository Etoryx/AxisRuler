plugins {
    id "net.neoforged.moddev" version "${moddevgradle_version}"
}

base {
    archivesName = "${mod_id}-neoforge-mc1218"
}

neoForge {
    version = "${neoforge_1218}"

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // Make the shared core part of the mod in dev runs too (it is bundled into the jar for
            // production); without this the 21.8 dev client cannot load core classes.
            sourceSet project(":axisruler-core").sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
    }
}

dependencies {
    implementation project(":axisruler-core")
}

// The 21.8 line strictly pins gson 2.11.0 (via minecraft-dependencies); core requests 2.13.1.
// Force the platform-provided version so the runtime classpath resolves (core uses only basic
// Gson API, compatible with 2.11.0). slf4j is likewise satisfied by the platform.
configurations.all {
    resolutionStrategy {
        force "com.google.code.gson:gson:2.11.0"
    }
}

jar {
    from(project(":axisruler-core").sourceSets.main.output)
}

sourcesJar {
    from(project(":axisruler-core").sourceSets.main.allSource)
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraftRange", minecraft_1218
    inputs.property "neoforgeRange", neoforge_range_1218

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
                version: project.version,
                modId: mod_id,
                modName: mod_name,
                modDescription: mod_description,
                modLicense: mod_license,
                modAuthors: mod_authors,
                modHomepage: mod_homepage,
                modSources: mod_sources,
                modIssues: mod_issues,
                minecraftRange: "[${minecraft_1218}]",
                neoforgeRange: neoforge_range_1218
        )
    }
}
